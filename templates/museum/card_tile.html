<a class="card-tile" href="{% url 'card' card.pk %}"><div class="card-image">{% if card.image %}<img src="{{ card.image.url }}" alt="{{ card.alt }}" loading="lazy" data-fallback>{% else %}<span class="image-placeholder">м.<small>Экспонат без иллюстрации</small></span>{% endif %}</div><div class="card-info"><p class="eyebrow">{{ card.get_type_display }} / {{ card.period }}</p><h3>{{ card.title }}</h3><p>{{ card.teaser }}</p><div class="tile-meta"><span>{{ card.topic.title }}</span><span aria-hidden="true">↗</span></div></div></a>
